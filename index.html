<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cáscara</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .landing {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .video-mobile {
      display: none;
    }

    .overlay {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      color: white;
    }

    .navigation {
      position: absolute;
      left: 50%;
      bottom: 11vh;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 55px;
      white-space: nowrap;
    }

    .navigation a {
      color: white;
      text-decoration: none;
      text-transform: uppercase;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 0.16em;
      transition: opacity 0.25s ease;
    }

    .navigation a:hover {
      opacity: 0.55;
    }

    .mobile-logo {
      display: none;
    }

    @media (max-width: 700px) {

      .video-desktop {
        display: none;
      }

      .video-mobile {
        display: block;
      }

      .mobile-logo {
        display: block;
        position: absolute;
        z-index: 2;
        left: 50%;
        top: 13vh;
        transform: translateX(-50%);
        width: 115px;
        height: auto;
      }

      .navigation {
        left: 50%;
        bottom: 10vh;
        transform: translateX(-50%);
        flex-direction: column;
        gap: 22px;
      }

      .navigation a {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <main class="landing">

    <!-- DESKTOP: lo resolvemos después -->

    <video
      class="background video-desktop"
      autoplay
      muted
      loop
      playsinline
    >
      <source src="video-horizontal.mp4" type="video/mp4">
    </video>


    <!-- CELULAR -->

    <video
      class="background video-mobile"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    >
      <source
        src="https://res.cloudinary.com/dsppfoxzs/video/upload/v1789257807/para_landing_brvwox.mov"
        type="video/quicktime"
      >
    </video>


    <!-- LOGO CELULAR -->

    <img
      class="mobile-logo"
      src="https://res.cloudinary.com/dsppfoxzs/image/upload/v1789257862/cascara_logo_cursiva_negro_mxvpf5.png"
      alt="Cáscara"
    >


    <!-- LINKS -->

    <div class="overlay">

      <nav class="navigation">
        <a href="#">Argentina</a>
        <a href="#">Rest of the World (Soon)</a>
        <a href="#">Archivo</a>
      </nav>

    </div>

  </main>

</body>
</html>
