<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cáscara</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .landing {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .image-mobile {
      display: none;
    }

    .overlay {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .navigation {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 55px;
    }

    .navigation a {
      color: white;
      text-decoration: none;
      text-transform: uppercase;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 0.16em;
      transition: opacity 0.25s ease;
    }

    .navigation a:hover {
      opacity: 0.55;
    }

    @media (max-width: 700px) {

      .video-desktop {
        display: none;
      }

      .image-mobile {
        display: block;
      }

      .overlay {
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding-bottom: 11vh;
}

      .navigation {
        flex-direction: column;
        gap: 22px;
      }

      .navigation a {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <main class="landing">

    <video
      class="background video-desktop"
      autoplay
      muted
      loop
      playsinline
    >
      <source src="video-horizontal.mp4" type="video/mp4">
    </video>

    <img
      class="background image-mobile"
      src="https://res.cloudinary.com/dsppfoxzs/image/upload/v1789244763/cpm35_2026-09-12_172519A17AAE82844A_msp1s8.jpg"
      alt=""
    >

    <div class="overlay">
      <nav class="navigation">
        <a href="#">Argentina</a>
        <a href="#">Rest of the World (soon)</a>
        <a href="#">Archivo</a>
      </nav>
    </div>

  </main>

</body>
</html>
