<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cáscara</title>
  <link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dsppfoxzs/image/upload/v1789679362/IMG_4084_vkiran.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .landing {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .image-mobile {
      display: none;
    }

    .overlay {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 12vh;
}

    .navigation {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 55px;
    }

    .navigation a {
      color: white;
      text-decoration: none;
      text-transform: uppercase;
      font-family: "Times New Roman", Times, serif;
      font-size: 12px;
      letter-spacing: 0.16em;
      transition: opacity 0.25s ease;
    }

    .navigation a:hover {
      opacity: 0.55;
    }

    .background {
  opacity: 0;
  animation: fadeIn 0.7s ease-out forwards;
}

.navigation a {
  opacity: 0;
  animation: fadeIn 0.45s ease-out forwards;
}

.navigation a:nth-child(1) {
  animation-delay: 0.20s;
}

.navigation a:nth-child(2) {
  animation-delay: 0.30s;
}

.navigation a:nth-child(3) {
  animation-delay: 0.40s;
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

    @media (max-width: 700px) {

      .image-desktop {
  display: none;
}

      .image-mobile {
        display: block;
      }

      .overlay {
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding-bottom: 11vh;
}

      .navigation {
        flex-direction: column;
        gap: 22px;
      }

      .navigation a {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <main class="landing">

    <img
  class="background image-desktop"
  src="https://res.cloudinary.com/dsppfoxzs/image/upload/v1789675164/ChatGPT_Image_Sep_17_2026_04_59_05_PM_kuqkao.png"
  alt=""
>

    <img
      class="background image-mobile"
      src="https://res.cloudinary.com/dsppfoxzs/image/upload/v1789244763/cpm35_2026-09-12_172519A17AAE82844A_msp1s8.jpg"
      alt=""
    >

    <div class="overlay">
      <nav class="navigation">
        <a href="https://shop.cascara.com.ar">Argentina</a>
        <a href="#">World (soon)</a>
        <a href="https://archivo.cascara.com.ar">Archivo</a>
      </nav>
    </div>

  </main>

</body>
</html>
